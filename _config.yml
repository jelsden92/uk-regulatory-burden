title: UK Regulatory Burden
description: >-
  The first comprehensive, validated measure of prescriptive regulatory burden
  across the UK statute book. Where QuantGov RegData counts restriction words,
  UKRegBurden counts the burdens themselves — distinct legal obligations and
  prohibitions, individuated, deduplicated, and classified by who bears them
  and in what capacity.
author: Jethro Elsden

# Project Pages theme — clean, professional, mobile-friendly, suitable for a
# research/methodology landing page. README.md is rendered as the index.
theme: jekyll-theme-cayman

# Hide the theme's "View on GitHub / Download .zip / Download .tar.gz" buttons.
show_downloads: false

# Exclude files that should not appear on the published site.
exclude:
  - LICENSE
  - LICENSE-docs
  - .gitignore
  - corpus_manifest.csv
  - "*.py"
  - "*.docx"
  - "*.db"
  - "Bulk download/"

# Use the GitHub-rendered Markdown processor.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Show the source-of-truth link in footer.
github:
  is_project_page: true
